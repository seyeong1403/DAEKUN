name: Deploy Static Website to 1Panel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to 1Panel Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_KEY }}
          port: 2218
          script: |
            echo "===== 开始部署 daekun====="
            cd /opt/1panel/www/sites/daekun.vigo.co.kr/index
            git pull origin main
            echo "===== daekun部署完成 ====="
